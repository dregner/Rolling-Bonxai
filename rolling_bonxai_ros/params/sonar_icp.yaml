/**:
  ros__parameters:
    frame_id: map
    base_frame_id: base_link
    topic_in: /Passive/sonar3d/pointcloud
    use_sim_time: true
    occupancy:
      resolution: 0.05
      occupancy_min_z: -100.0
      occupancy_max_z: 100.0
      occupancy_threshold: 0.5
    sensor_model:
      max_range: 10.0
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97
    rolling:
      coordinate_system:
        chunk_size: 1.0  # Finer rolling transitions for short vehicle trajectories.
      loading_policy:
        name: neighbourhood
        neighborhood:
          radius: 11  # 1 * (11 - 0.2) >= 10 m range + 0.03 m voxel margin.
      asyncio:
        enable_io: true
        num_load_threads: 3
        num_save_threads: 1
    icp:
      enabled: true
      reconstruction_frame: reconstruction
      ignore_static_body_tf: true  # Recorded static map->base_link must not override dynamic poses.
      pose_time_offset: 0.0  # Deliberately uncalibrated; never reuse another bag's offset.
      max_tf_wait: 3.0
      min_range: 0.3
      max_range: 10.0
      keyframe_translation: 0.1
      keyframe_rotation_deg: 5.0
      keyframe_interval: 2.0
      target_radius: 10.0
      max_target_points: 60000
      voxels: [0.10, 0.05]
      max_distances: [0.80, 0.25]
      iterations: [40, 30]
      normal_radius: 0.3
      huber: 0.05
      min_fitness: 0.6
      max_rmse: 0.12
      max_translation: 0.5
      max_rotation_deg: 10.0
      min_eigen_ratio: 0.001
    clean:
      enabled: true
      build_occupancy: false  # Surface-only mapping; enable if free-space occupancy is needed too.
      azimuth_beams: 256
      elevation_beams: 64
      azimuth_fov: 90.0
      elevation_fov: 40.0
      projection_offset: [0.0, 0.0, 0.0]
      window: 5
      min_neighbors: 10
      min_component: 60
      range_abs: 0.10
      range_rel: 0.02
      voxel: 0.03
      min_hits: 2
      min_ratio: 0.7
      miss_abs: 0.08
      miss_rel: 0.02
      publish_rate: 1.0
      publish_max_points: 200000
      save_path: /tmp/rolling_clean_map.ply
    stats:
      enable_stats: true
      publish_occupied_voxels: false
      publish_rate: 1.0
